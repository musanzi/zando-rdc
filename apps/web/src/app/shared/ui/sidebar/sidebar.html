<div class="flex h-full w-70 min-h-0 flex-col overflow-hidden bg-surface text-white">
  <div class="relative flex shrink-0 items-center gap-x-2.5 pt-5 pr-4 pb-0 pl-6">
    <a routerLink="/" class="flex items-center gap-2">
      <img
        src="/images/logos/IMG_20260901_202737_148.png"
        alt=""
        width="1219"
        height="1240"
        class="size-9 object-contain" />
      <span class="text-2xl font-bold tracking-tight">Zando RDC</span>
    </a>
  </div>

  <navigation class="mt-8 mb-4 min-h-0 flex-1 overflow-y-auto" [items]="navigation()" />

  <div class="shrink-0 p-2">
    <user [user]="user()" (editProfile)="editProfile.emit()" (signedOut)="signedOut.emit()" />
  </div>
</div>
