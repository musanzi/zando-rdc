<section class="bg-background pt-32 pb-16 text-on-background sm:pt-40 sm:pb-24">
  <div class="mx-auto grid w-full max-w-7xl items-center gap-12 px-4 sm:px-6 lg:grid-cols-[1.4fr_0.6fr] lg:px-8">
    <div class="max-w-2xl">
      <h1 class="text-5xl font-bold leading-tight sm:text-6xl">Zando RDC,<br />le lien local.</h1>
      <p class="mt-6 max-w-xl text-xl leading-7 text-on-surface-variant">
        Nous préparons un catalogue de fournisseurs à Lubumbashi pour vous aider à trouver les services et les produits
        dont vous avez besoin.
      </p>
      <p class="mt-4 text-lg leading-7 text-on-surface-variant">Le catalogue public sera disponible prochainement.</p>
      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center">
        @if (isAuthenticated()) {
          <a matButton="filled" routerLink="/dashboard"
            >Ouvrir mon espace <mat-icon class="ml-2 size-4" svgIcon="arrow-right"
          /></a>
          <button matButton="outlined" type="button" [disabled]="isLoading()" (click)="signOut.emit()">
            {{ isLoading() ? 'Déconnexion…' : 'Se déconnecter' }}
          </button>
        } @else {
          <a matButton="filled" routerLink="/auth/sign-in"
            >Accéder à mon espace <mat-icon class="ml-2 size-4" svgIcon="arrow-right"
          /></a>
        }
      </div>
    </div>
    <img
      src="/images/logos/IMG_20260901_202737_148.png"
      alt=""
      width="1219"
      height="1240"
      class="mx-auto hidden w-full max-w-64 object-contain lg:block" />
  </div>
</section>
