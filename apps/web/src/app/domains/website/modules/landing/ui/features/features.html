<section id="features" class="border-t border-outline-variant bg-surface py-16">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <h2 class="text-4xl font-bold text-on-surface">Un catalogue en préparation</h2>
    <p class="mt-4 max-w-2xl text-xl leading-7 text-on-surface-variant">
      Voici le parcours prévu pour découvrir les fournisseurs locaux avec Zando RDC.
    </p>
    <dl class="mt-10 divide-y divide-outline-variant">
      @for (feature of features; track feature.title) {
        <div class="grid gap-3 py-6 md:grid-cols-[1fr_2fr] md:gap-12">
          <dt class="text-2xl font-semibold text-on-surface">{{ feature.title }}</dt>
          <dd class="max-w-2xl text-lg leading-7 text-on-surface-variant">{{ feature.description }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
