<section id="get-started" class="bg-surface py-20">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div
      class="flex flex-col items-start justify-between gap-8 border-t border-outline-variant pt-12 md:flex-row md:items-center">
      <div class="max-w-2xl">
        <h2 class="text-4xl font-bold text-on-surface">Votre espace Zando RDC</h2>
        <p class="mt-4 text-xl leading-7 text-on-surface-variant">
          Connectez-vous pour accéder à votre compte et à vos outils de gestion.
        </p>
      </div>

      @if (isAuthenticated()) {
        <a matButton="filled" routerLink="/dashboard">
          Ouvrir mon espace
          <mat-icon class="ml-2 size-4" svgIcon="arrow-right" />
        </a>
      } @else {
        <a matButton="filled" routerLink="/auth/sign-in">
          Se connecter
          <mat-icon class="ml-2 size-4" svgIcon="arrow-right" />
        </a>
      }
    </div>
  </div>
</section>
