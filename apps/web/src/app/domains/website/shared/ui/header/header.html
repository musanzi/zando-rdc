<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-[background-color,border-color,box-shadow] duration-300"
  [class.border-transparent]="!solidHeader()"
  [class.bg-transparent]="!solidHeader()"
  [class.border-outline-variant/80]="solidHeader()"
  [class.bg-surface/95]="solidHeader()"
  [class.shadow-sm]="solidHeader()"
  [class.backdrop-blur-xl]="solidHeader()">
  <nav class="mx-auto flex max-w-screen-2xl items-center py-4 justify-between px-6 sm:px-8 lg:px-16 xl:px-24 2xl:px-32">
    <a routerLink="/" class="flex items-center gap-2" aria-label="Zando RDC, accueil" (click)="closeMenu()">
      <img src="/images/logos/IMG_20260901_202723_766.png" alt="Zando" width="1718" height="625" class="h-12 w-auto" />
      <span class="text-sm font-semibold text-white">RDC</span>
    </a>

    <div class="hidden h-full items-center gap-8 lg:flex">
      @for (link of links; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive
          #desktopLink="routerLinkActive"
          [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
          class="flex h-full items-center py-2 border-b-2 px-0.5 pt-0.5 text-sm font-semibold transition-colors"
          [class]="navLinkClasses(desktopLink.isActive)">
          {{ link.label }}
        </a>
      }
    </div>

    <div class="hidden items-center gap-2 lg:flex">
      <a matButton="filled" routerLink="/auth/sign-in" class="rounded-md px-4 py-2.5 font-semibold"> Espace équipe </a>
    </div>

    <button
      type="button"
      class="flex size-11 items-center justify-center rounded-full border shadow-sm transition-colors lg:hidden"
      [class]="
        !isScrolled() ? 'border-white/25 bg-surface/10 text-white' : 'border-outline-variant bg-surface text-on-surface'
      "
      aria-label="Menu de navigation"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()">
      <mat-icon [svgIcon]="isMenuOpen() ? 'x' : 'menu'" />
    </button>
  </nav>

  @if (isMenuOpen()) {
    <div id="mobile-navigation" class="border-t border-outline-variant bg-surface px-6 py-6 shadow-xl lg:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment ?? undefined"
            routerLinkActive
            #mobileLink="routerLinkActive"
            [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-base font-semibold transition"
            [class]="mobileNavLinkClasses(mobileLink.isActive)"
            (click)="closeMenu()">
            <mat-icon class="size-5" [svgIcon]="link.icon" />
            {{ link.label }}
          </a>
        }
      </div>
      <div class="mt-5 grid grid-cols-1 gap-3 border-t border-outline-variant pt-5">
        <a
          routerLink="/auth/sign-in"
          class="flex items-center justify-center gap-2 rounded-md border border-outline-variant px-4 py-3 text-center font-semibold"
          (click)="closeMenu()">
          <mat-icon class="size-5" svgIcon="log-in" />
          Connexion
        </a>
      </div>
    </div>
  }
</header>
